<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos & Software | DODI SYSTEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { dark: '#0B1120', card: '#1E293B', blue: '#2563EB', cyan: '#06B6D4', emerald: '#10B981' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-brand-dark/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="font-black text-2xl text-white">DODI SYSTEM</a>
      <nav class="flex gap-6 text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-white">Inicio</a>
        <a href="productos.html" class="text-white">Productos</a>
      </nav>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-6xl mx-auto px-4 py-16 w-full space-y-12">
    <div class="text-center max-w-2xl mx-auto space-y-4">
      <h1 class="text-3xl sm:text-5xl font-black text-white">Catálogo <span class="text-brand-cyan">Dodi System</span></h1>
      <p class="text-slate-400">Controlado 100% desde Google Sheets.</p>
    </div>

    <!-- Contenedor Dinámico -->
    <div id="catalogo-productos" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div class="col-span-full text-center py-12 text-slate-400">Cargando productos...</div>
    </div>
  </main>

  <!-- Script de Conexión -->
  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT QUE TERMINA EN /exec
    const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbyyWp-VI74gfkG5Qf7Qns0EbmksA41R-bmaTIrvn2NmuaE6bSSssdOZU-Et2oi0dz6r1Q/exec";

    async function cargarCatalogo() {
      const contenedor = document.getElementById('catalogo-productos');

      try {
        const respuesta = await fetch(GOOGLE_SHEETS_API_URL, { redirect: "follow" });
        const productos = await respuesta.json();

        if (!Array.isArray(productos) || productos.length === 0) {
          contenedor.innerHTML = `<p class="text-slate-400 text-center col-span-full">No hay productos activos disponibles.</p>`;
          return;
        }

        contenedor.innerHTML = "";

        productos.forEach(p => {
          const precioNum = Number(p.precio) || 0;
          const precioRegNum = Number(p.precio_regular) || 0;
          const tieneOferta = precioRegNum > precioNum;
          const insignia = p.etiqueta_oferta ? `<span class="bg-red-500/20 text-red-400 text-[10px] font-bold px-2 py-1 rounded uppercase">${p.etiqueta_oferta}</span>` : '';

          contenedor.innerHTML += `
            <div class="bg-brand-card rounded-2xl border border-slate-700 p-6 space-y-4 flex flex-col justify-between">
              <div>
                <div class="w-12 h-12 bg-brand-cyan/10 border border-brand-cyan/30 rounded-xl flex items-center justify-center text-brand-cyan font-bold text-2xl mb-4">📦</div>
                <div class="flex justify-between items-start mb-2">
                  <h2 class="text-xl font-bold text-white">${p.nombre}</h2>
                  ${insignia}
                </div>
                <p class="text-slate-300 text-sm mb-4">${p.descripcion || ''}</p>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-black text-brand-cyan">$${precioNum.toLocaleString('es-MX')} MXN</span>
                  ${tieneOferta ? `<span class="text-sm text-slate-500 line-through">$${precioRegNum.toLocaleString('es-MX')}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        contenedor.innerHTML = `<p class="text-red-400 text-center col-span-full">Error al conectar con la hoja de cálculo.</p>`;
      }
    }

    cargarCatalogo();
  </script>
</body>
</html>
