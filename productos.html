<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dodi System - Catálogo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#06b6d4',
              blue: '#2563eb',
              dark: '#090d16',
              card: '#111827'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f8fafc; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40 px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-cyan-500/20">D</div>
      <span class="text-2xl font-black tracking-tight text-white">DODI <span class="text-cyan-400">SYSTEM</span></span>
    </div>
    <button onclick="abrirCarrito()" class="relative bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-2 transition-colors">
      <i class="fa-solid fa-cart-shopping text-cyan-400"></i>
      <span class="text-sm font-bold">Carrito</span>
      <span id="carrito-contador" class="absolute -top-2 -right-2 bg-cyan-500 text-slate-950 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow-md">0</span>
    </button>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-8">
      <h1 class="text-3xl font-black text-white mb-2">Catálogo de Productos</h1>
      <p class="text-slate-400">Hardware, componentes y tecnología con múltiples fotos reales y reseñas de YouTube integradas.</p>
    </div>
    
    <div id="catalogo-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Los productos se cargan dinámicamente -->
    </div>
  </main>

  <div id="modal-video" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="relative w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
      <button onclick="cerrarVideoGrande()" class="absolute top-3 right-3 z-10 bg-slate-800/80 hover:bg-red-600 text-white font-bold w-10 h-10 rounded-full flex items-center justify-center transition-colors text-xl">
        &times;
      </button>
      <div id="contenido-video-modal" class="w-full aspect-video bg-black"></div>
    </div>
  </div>

  <div id="modal-checkout" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="relative w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl p-6 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-cyan-400"></i> Tu Carrito</h2>
        <button onclick="cerrarCheckout()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>
      <div id="lista-carrito" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1"></div>
      <div class="border-t border-slate-800 pt-4 mt-auto">
        <div class="flex justify-between items-center mb-4">
          <span class="text-slate-400 font-medium">Total:</span>
          <span id="carrito-total" class="text-2xl font-black text-white">$0 MXN</span>
        </div>
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Método de pago:</label>
          <select id="metodo-pago" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2.5 focus:outline-none focus:border-cyan-500">
            <option value="MercadoPago">Mercado Pago (Tarjetas, OXXO, etc.)</option>
            <option value="SPEI_Directo">Transferencia Directa (WhatsApp)</option>
          </select>
        </div>
        <button onclick="procesarPagoMercadoPago()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
          <span>Continuar con el Pago</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    let carrito = [];

    async function cargarCatalogoDinamico() {
      const contenedor = document.getElementById('catalogo-grid');
      if (contenedor) {
        contenedor.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
            <p>Cargando inventario...</p>
          </div>
        `;
      }

      try {
        const productosPrueba = [
          {
            nombre: "Nintendo Switch V1 (Completa / Excelente estado)",
            categoria: "Consolas",
            precio: 2900,
            stock: 1,
            descripcion: "Consola original con dock de TV, cables y Joy-Cons funcionando perfecto. Fotos reales y video reseña oficial incluidos.",
            imagenes: [
              "https://images.unsplash.com/photo-1578303512597-81e6cc155b12?auto=format&fit=crop&w=600&q=80",
              "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=600&q=80"
            ],
            video_url: "https://www.youtube.com/watch?v=kJQP7kiw5Fk"
          },
          {
            nombre: "Router TP-Link Archer C6 Gigabit",
            categoria: "Redes",
            precio: 850,
            stock: 3,
            descripcion: "Router Wi-Fi AC1200 de doble banda ideal para fibra óptica.",
            imagenes: [
              "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=600&q=80"
            ],
            video_url: "https://www.youtube.com/watch?v=yKD2ykbAzGs"
          }
        ];

        let productos = productosPrueba;
        try {
          const respuesta = await fetch('/api/catalogo');
          if (respuesta.ok) {
            const datosRemotos = await respuesta.json();
            if (Array.isArray(datosRemotos) && datosRemotos.length > 0) {
              productos = datosRemotos;
            }
          }
        } catch(e) {
          console.log("Usando datos locales de demostración.");
        }

        renderizarProductos(productos);
      } catch (error) {
        console.error("Error:", error);
        if (contenedor) {
          contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-red-400"><p>Error al conectar con el inventario.</p></div>`;
        }
      }
    }

    function renderizarProductos(productos) {
      const contenedor = document.getElementById('catalogo-grid');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      productos.forEach((prod, prodIndex) => {
        const stockCrudo = prod.stock !== undefined ? prod.stock : (prod.Stock !== undefined ? prod.Stock : 0);
        const stockReal = parseInt(String(stockCrudo).replace(/[^0-9]/g, ''), 10);
        const stock = !isNaN(stockReal) ? stockReal : 0;

        let slidesHtml = '';
        let listaImgs = prod.imagenes || (prod.imagen ? [prod.imagen] : []);
        if (listaImgs.length === 0) {
          listaImgs = ["https://placehold.co/600x400/111827/06b6d4?text=Dodi+System"];
        }

        listaImgs.forEach((imgUrl, imgIdx) => {
          slidesHtml += `
            <div class="w-full h-full flex-shrink-0 relative bg-slate-950 flex items-center justify-center">
              <img src="${imgUrl}" alt="${prod.nombre}" class="w-full h-full object-cover">
              <span class="absolute bottom-2 left-2 bg-slate-900/80 text-cyan-400 text-[10px] font-black px-2 py-1 rounded-lg border border-slate-700">Foto ${imgIdx + 1} de ${listaImgs.length}</span>
            </div>
          `;
        });

        const videoSrc = prod.video_url || prod.video || '';
        let videoId = '';
        if (videoSrc && videoSrc.trim() !== '') {
          if (videoSrc.includes('youtu.be/')) {
            videoId = videoSrc.split('youtu.be/')[1].split('?')[0];
          } else if (videoSrc.includes('youtube.com/watch')) {
            const urlParams = new URLSearchParams(new URL(videoSrc).search);
            videoId = urlParams.get('v');
          }

          if (videoId) {
            slidesHtml += `
              <div class="w-full h-full flex-shrink-0 relative bg-slate-950 cursor-pointer group" onclick="abrirVideoGrande('${videoSrc}')" title="Haz clic para ampliar la reseña con sonido">
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1" class="w-full h-full pointer-events-none object-cover" frameborder="0"></iframe>
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                  <span class="bg-slate-900/90 text-white px-3.5 py-2 rounded-xl text-xs font-black shadow-lg border border-slate-700 opacity-90 group-hover:opacity-100 transition-opacity flex items-center gap-2">
                    <i class="fa-solid fa-play text-cyan-400"></i> Ver Reseña Video
                  </span>
                </div>
              </div>
            `;
          }
        }

        let badgeStock = stock <= 0 ? 
          `<span class="text-xs font-bold text-red-400 bg-red-400/10 px-3 py-1 rounded-full">Agotado</span>` : 
          `<span class="text-xs font-bold uppercase tracking-wider text-cyan-400 bg-cyan-400/10 px-3 py-1 rounded-full">${prod.categoria || 'Hardware'} (${stock} disp.)</span>`;

        let botonHtml = stock <= 0 ? 
          `<button disabled class="bg-slate-800 text-slate-500 font-bold px-4 py-2.5 rounded-xl cursor-not-allowed">Agotado</button>` : 
          `<button onclick='agregarAlCarrito(${JSON.stringify({...prod, stock: stock})})' class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/20">Agregar</button>`;

        const card = document.createElement('div');
        card.className = "bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col justify-between shadow-xl hover:border-cyan-500/50 transition-all duration-300";

        card.innerHTML = `
          <div>
            <div class="relative w-full h-48 mb-4 rounded-xl overflow-hidden border border-slate-800 bg-slate-950 group">
              <div id="track-${prodIndex}" class="w-full h-full flex transition-transform duration-300 ease-out">
                ${slidesHtml}
              </div>
              ${(listaImgs.length + (videoId ? 1 : 0)) > 1 ? `
                <button onclick="moverCarrusel(${prodIndex}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md border border-slate-700">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="moverCarrusel(${prodIndex}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md border border-slate-700">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
              ` : ''}
            </div>

            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">${prod.categoria || 'Hardware'}</span>
              ${badgeStock}
            </div>
            <h3 class="text-xl font-black text-white mb-2">${prod.nombre}</h3>
            <p class="text-slate-300 text-sm mb-4 leading-relaxed">${prod.descripcion || 'Sin descripción disponible.'}</p>
          </div>
          <div class="flex items-center justify-between pt-4 border-t border-slate-800">
            <span class="text-2xl font-black text-white">$${Number(prod.precio).toLocaleString('es-MX')} <span class="text-xs text-slate-400 font-normal">MXN</span></span>
            ${botonHtml}
          </div>
        `;
        contenedor.appendChild(card);
        window[`indicesCarrusel_${prodIndex}`] = { actual: 0, total: listaImgs.length + (videoId ? 1 : 0) };
      });
    }

    function moverCarrusel(prodIndex, direccion) {
      const state = window[`indicesCarrusel_${prodIndex}`];
      if (!state) return;
      state.actual = (state.actual + direccion + state.total) % state.total;
      const track = document.getElementById(`track-${prodIndex}`);
      if (track) {
        track.style.transform = `translateX(-${state.actual * 100}%)`;
      }
    }

    function abrirVideoGrande(urlVideoOriginal) {
      const modal = document.getElementById('modal-video');
      const contenedorVideo = document.getElementById('contenido-video-modal');
      if (!modal || !contenedorVideo) return;

      let videoId = '';
      if (urlVideoOriginal.includes('youtu.be/')) {
        videoId = urlVideoOriginal.split('youtu.be/')[1].split('?')[0];
      } else if (urlVideoOriginal.includes('youtube.com/watch')) {
        const urlParams = new URLSearchParams(new URL(urlVideoOriginal).search);
        videoId = urlParams.get('v');
      }

      if (videoId) {
        contenedorVideo.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&modestbranding=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        `;
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function cerrarVideoGrande() {
      const modal = document.getElementById('modal-video');
      const contenedorVideo = document.getElementById('contenido-video-modal');
      if (modal && contenedorVideo) {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
        contenedorVideo.innerHTML = '';
      }
    }

    function agregarAlCarrito(producto, cantidadAñadir = 1) {
      const stockDisponible = Number(producto.stock || 0);
      const itemExistente = carrito.find(item => item.nombre === producto.nombre);
      if (itemExistente) {
        const nuevaCantidad = itemExistente.cantidad + cantidadAñadir;
        if (nuevaCantidad > stockDisponible) {
          itemExistente.cantidad = stockDisponible;
        } else {
          itemExistente.cantidad = nuevaCantidad;
        }
      } else {
        carrito.push({ ...producto, cantidad: cantidadAñadir });
      }
      actualizarContadorCarrito();
    }

    function actualizarContadorCarrito() {
      const contador = document.getElementById('carrito-contador');
      if (contador) {
        const totalPiezas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        contador.textContent = totalPiezas;
      }
    }

    function abrirCarrito() {
      const modal = document.getElementById('modal-checkout');
      const lista = document.getElementById('lista-carrito');
      const totalEl = document.getElementById('carrito-total');
      if (!modal || !lista || !totalEl) return;

      lista.innerHTML = '';
      let total = 0;
      if (carrito.length === 0) {
        lista.innerHTML = '<p class="text-slate-400 text-center py-4">Tu carrito está vacío</p>';
      } else {
        carrito.forEach((item, index) => {
          const subtotal = Number(item.precio || 0) * item.cantidad;
          total += subtotal;
          lista.innerHTML += `
            <div class="flex justify-between items-center bg-slate-800/60 p-3 rounded-xl border border-slate-700 text-sm gap-2">
              <div class="flex-1 min-w-0">
                <span class="font-bold text-white block truncate">${item.nombre}</span>
                <span class="text-slate-400 text-xs">$${Number(item.precio).toLocaleString('es-MX')} MXN c/u</span>
              </div>
              <span class="font-bold text-cyan-400 text-xs">Cant: ${item.cantidad}</span>
              <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300 font-bold px-2 text-base">&times;</button>
            </div>
          `;
        });
      }
      totalEl.textContent = `$${total.toLocaleString('es-MX')} MXN`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarContadorCarrito();
      abrirCarrito();
    }

    function cerrarCheckout() {
      const modal = document.getElementById('modal-checkout');
      if (modal) {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }
    }

    async function procesarPagoMercadoPago() {
      if (carrito.length === 0) {
        return;
      }
      const metodo = document.getElementById('metodo-pago').value;
      if (metodo === 'SPEI_Directo') {
        let mensajeWsp = "Hola DODI SYSTEM, quiero confirmar mi compra:%0A";
        carrito.forEach(item => {
          mensajeWsp += `- ${item.cantidad}x ${item.nombre} ($${(item.precio * item.cantidad).toLocaleString('es-MX')} MXN)%0A`;
        });
        window.open(`https://wa.me/527442320022?text=${mensajeWsp}`, '_blank');
        return;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarCatalogoDinamico();
    });
  </script>
</body>
</html>
